[package]
name = "byte_reader_addin"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
native_api_1c = "0.10.7"
utf16_lit = "2.0"
tantivy = { version = "0.19", default-features = false, features = ["mmap"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1